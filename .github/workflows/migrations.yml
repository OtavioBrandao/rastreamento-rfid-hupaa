name: Migrations

on:
  workflow_call:

permissions:
  contents: read

jobs:
  migrations:
    name: Validação completa
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/ci_db
      # A suíte de banco (ISS-009) exige TEST_DATABASE_URL explícita e recusa
      # host não-local: ela roda TRUNCATE nas tabelas do CRUD. Sem esta linha
      # os testes de banco seriam PULADOS aqui, em silêncio. O banco é o
      # container efêmero do job, então truncar é inofensivo.
      TEST_DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/ci_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Aplicar migrations em banco vazio (upgrade head)
        run: python -m alembic upgrade head

      - name: Confirmar que reaplicar não duplica nem corrompe
        run: python -m alembic upgrade head

      - name: Reverter tudo (downgrade base)
        run: python -m alembic downgrade base

      - name: Reaplicar (confirma que o rollback é reversível)
        run: python -m alembic upgrade head

      - name: "Conferir schema resultante (19 tabelas: 18 do domínio + alembic_version)"
        run: |
          python -c "
          import os
          import psycopg2

          url = os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://')
          conn = psycopg2.connect(url)
          cur = conn.cursor()
          cur.execute(\"SELECT count(*) FROM pg_tables WHERE schemaname = 'public';\")
          count = cur.fetchone()[0]
          print(f'Tabelas encontradas: {count}')
          assert count == 19, f'Esperava 19 tabelas, encontrou {count} — schema não bateu com o esperado'
          "

      - name: Rodar suíte de testes
        run: python -m pytest tests/ -v
