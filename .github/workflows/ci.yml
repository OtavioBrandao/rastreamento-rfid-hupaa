name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testar interface
        run: npm test
      - name: Gerar build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements/dev.txt

      - name: Verificar lint
        run: python -m ruff check --config config/ruff.toml --select E4,E7,E9,F .

      - name: Verificar docstrings
        run: python scripts/documentation.py --check

      - name: Verificar formatação dos imports
        run: python -m ruff check --config config/ruff.toml --select I .

  tests:
    name: Testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/ci_db
      DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/ci_db

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements/dev.txt

      - name: Iniciar Mosquitto local
        run: |
          docker compose -f deploy/compose.yaml --profile local up -d mosquitto
          for _attempt in {1..20}; do
            if docker compose -f deploy/compose.yaml --profile local exec -T mosquitto \
              mosquitto_sub -h 127.0.0.1 -t '$SYS/broker/version' -C 1 -W 1 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/compose.yaml --profile local logs mosquitto
          exit 1

      - name: Aplicar migrations no banco de testes
        run: python -m alembic -c config/alembic.ini upgrade head

      - name: Executar testes unitários e de integração
        env:
          RUN_MQTT_INTEGRATION: "1"
          TEST_MQTT_PORT: "1883"
        run: python -m pytest -q

      - name: Encerrar Mosquitto local
        if: always()
        run: docker compose -f deploy/compose.yaml --profile local down --volumes --remove-orphans

  migrations:
    name: Migrations
    uses: ./.github/workflows/migrations.yml
