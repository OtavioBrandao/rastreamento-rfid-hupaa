name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar lint e imports
        run: python -m ruff check .

  tests:
    name: Testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Iniciar Mosquitto local
        run: |
          docker compose up -d mosquitto
          for attempt in {1..20}; do
            if docker compose exec -T mosquitto \
              mosquitto_sub -h 127.0.0.1 -t '$SYS/broker/version' -C 1 -W 1 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs mosquitto
          exit 1

      - name: Executar testes unitários e de integração
        env:
          RUN_MQTT_INTEGRATION: "1"
          TEST_MQTT_PORT: "1883"
        run: python -m pytest -q

      - name: Encerrar Mosquitto local
        if: always()
        run: docker compose down --volumes --remove-orphans
