x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  image: rfid-hospital-mvp:dev
  networks:
    - rfid-dev
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  restart: "no"

services:
  postgres:
    image: postgres:16.15-alpine
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rfid_hospital_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rfid_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfid_dev_only}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rfid-dev
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    profiles: ["local"]
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_LOCAL_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - rfid-dev
    healthcheck:
      test:
        - CMD
        - mosquitto_sub
        - -h
        - 127.0.0.1
        - -t
        - $$SYS/broker/version
        - -C
        - "1"
        - -W
        - "3"
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: "no"

  migrate-local:
    <<: *python-service
    profiles: ["local"]
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rfid_dev}:${POSTGRES_PASSWORD:-rfid_dev_only}@postgres:5432/${POSTGRES_DB:-rfid_hospital_dev}
    depends_on:
      postgres:
        condition: service_healthy

  ingestor-local:
    <<: *python-service
    profiles: ["local"]
    healthcheck:
      test: ["CMD", "python", "-m", "rfid_ingestion.health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s
    environment:
      MQTT_MODE: local
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TLS_ENABLED: "false"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_CA_CERT: ""
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-easy-local-ingestor}
      MQTT_TOPIC: ${MQTT_TOPIC:-easy/dev/hupaa/+/+/readings}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_RECONNECT_INITIAL_DELAY: ${MQTT_RECONNECT_INITIAL_DELAY:-1}
      MQTT_RECONNECT_MAX_DELAY: ${MQTT_RECONNECT_MAX_DELAY:-30}
      MQTT_RECONNECT_MULTIPLIER: ${MQTT_RECONNECT_MULTIPLIER:-2}
      MQTT_RECONNECT_JITTER: ${MQTT_RECONNECT_JITTER:-0.2}
      DB_RETRY_INITIAL_DELAY: ${DB_RETRY_INITIAL_DELAY:-1}
      DB_RETRY_MAX_DELAY: ${DB_RETRY_MAX_DELAY:-30}
      DB_RETRY_MULTIPLIER: ${DB_RETRY_MULTIPLIER:-2}
      DB_RETRY_JITTER: ${DB_RETRY_JITTER:-0.2}
      EVENTS_FILE: ${EVENTS_FILE:-data/raw_events.jsonl}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-65536}
      RFID_DEFAULT_ADAPTER: ${RFID_DEFAULT_ADAPTER:-ez700}
      RFID_READER_ADAPTERS: ${RFID_READER_ADAPTERS:-{}}
      EZ700_TIMESTAMP_FORMAT: ${EZ700_TIMESTAMP_FORMAT:-rfc3339}
      RFID_DEBOUNCE_WINDOW_MS: ${RFID_DEBOUNCE_WINDOW_MS:-250}
      RFID_OUT_OF_ORDER_TOLERANCE_MS: ${RFID_OUT_OF_ORDER_TOLERANCE_MS:-1000}
      RFID_PASSAGE_MAX_INTERVAL_MS: ${RFID_PASSAGE_MAX_INTERVAL_MS:-3000}
      RFID_PASSAGE_REFRACTORY_MS: ${RFID_PASSAGE_REFRACTORY_MS:-1000}
      RFID_PASSAGE_OVERLAP_GRACE_MS: ${RFID_PASSAGE_OVERLAP_GRACE_MS:-300}
      RFID_PASSAGE_ORIGIN_HOLD_MS: ${RFID_PASSAGE_ORIGIN_HOLD_MS:-1000}
      RFID_DIRECTION_AMBIGUITY_MS: ${RFID_DIRECTION_AMBIGUITY_MS:-100}
      APP_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rfid_dev}:${POSTGRES_PASSWORD:-rfid_dev_only}@postgres:5432/${POSTGRES_DB:-rfid_hospital_dev}
    volumes:
      - ./data:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy
      migrate-local:
        condition: service_completed_successfully

  migrate-managed:
    <<: *python-service
    profiles: ["managed"]
    entrypoint: ["/app/docker/require-database-url.sh"]
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}

  ingestor-managed:
    <<: *python-service
    profiles: ["managed"]
    healthcheck:
      test: ["CMD", "python", "-m", "rfid_ingestion.health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s
    command: ["python", "-m", "rfid_ingestion"]
    environment:
      MQTT_MODE: cloud
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-true}
      MQTT_INSECURE_LAB: ${MQTT_INSECURE_LAB:-false}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CA_CERT: ${MQTT_CA_CERT:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-easy/dev/hupaa/+/+/readings}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_RECONNECT_INITIAL_DELAY: ${MQTT_RECONNECT_INITIAL_DELAY:-1}
      MQTT_RECONNECT_MAX_DELAY: ${MQTT_RECONNECT_MAX_DELAY:-30}
      MQTT_RECONNECT_MULTIPLIER: ${MQTT_RECONNECT_MULTIPLIER:-2}
      MQTT_RECONNECT_JITTER: ${MQTT_RECONNECT_JITTER:-0.2}
      DB_RETRY_INITIAL_DELAY: ${DB_RETRY_INITIAL_DELAY:-1}
      DB_RETRY_MAX_DELAY: ${DB_RETRY_MAX_DELAY:-30}
      DB_RETRY_MULTIPLIER: ${DB_RETRY_MULTIPLIER:-2}
      DB_RETRY_JITTER: ${DB_RETRY_JITTER:-0.2}
      EVENTS_FILE: ${EVENTS_FILE:-data/raw_events.jsonl}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-65536}
      RFID_DEFAULT_ADAPTER: ${RFID_DEFAULT_ADAPTER:-ez700}
      RFID_READER_ADAPTERS: ${RFID_READER_ADAPTERS:-{}}
      EZ700_TIMESTAMP_FORMAT: ${EZ700_TIMESTAMP_FORMAT:-rfc3339}
      RFID_DEBOUNCE_WINDOW_MS: ${RFID_DEBOUNCE_WINDOW_MS:-250}
      RFID_OUT_OF_ORDER_TOLERANCE_MS: ${RFID_OUT_OF_ORDER_TOLERANCE_MS:-1000}
      RFID_PASSAGE_MAX_INTERVAL_MS: ${RFID_PASSAGE_MAX_INTERVAL_MS:-3000}
      RFID_PASSAGE_REFRACTORY_MS: ${RFID_PASSAGE_REFRACTORY_MS:-1000}
      RFID_PASSAGE_OVERLAP_GRACE_MS: ${RFID_PASSAGE_OVERLAP_GRACE_MS:-300}
      RFID_PASSAGE_ORIGIN_HOLD_MS: ${RFID_PASSAGE_ORIGIN_HOLD_MS:-1000}
      RFID_DIRECTION_AMBIGUITY_MS: ${RFID_DIRECTION_AMBIGUITY_MS:-100}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
    volumes:
      - ./data:/app/data
    depends_on:
      migrate-managed:
        condition: service_completed_successfully

networks:
  rfid-dev:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
