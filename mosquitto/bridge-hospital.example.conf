# MODELO de bridge Mosquitto na rede do hospital (EZ700 -> broker local -> HiveMQ Cloud).
# No Marco 2 o EZ700 não conectou direto ao HiveMQ por MQTTS; a bridge local funcionou.
# Copie para fora do Git, preencha e proteja (chmod 600). Nunca versione senhas.

# Leitores publicam na VLAN/IP interno combinado com a TI (sem acesso pela internet).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

connection hivemq-hupaa
address SEU-CLUSTER.hivemq.cloud:8883
bridge_protocol_version mqttv311
bridge_cafile /etc/ssl/certs/ca-certificates.crt
bridge_insecure false
remote_clientid hupaa-bridge-01
remote_username PREENCHA-FORA-DO-GIT
remote_password PREENCHA-FORA-DO-GIT
cleansession false
try_private false
notifications false
# Só leituras (e heartbeat, se validado) saem do hospital, com QoS 1.
topic easy/prod/hupaa/+/+/readings out 1
# topic easy/prod/hupaa/+/+/heartbeat out 1
